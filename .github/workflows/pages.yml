name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/daily-english-learning-app-1ybeib
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ chạy một lần deploy tại một thời điểm; không huỷ bản đang chạy dở.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Kiểm tra dữ liệu và logic chấm điểm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.mjs

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Tự bật Pages nếu token đủ quyền. Token mặc định của Actions thì KHÔNG —
          # nó báo "Create Pages site failed: Resource not accessible by integration".
          # Khi đó phải bật tay một lần: Settings → Pages → Source = GitHub Actions
          # (xem mục "Deploy lên GitHub Pages" trong README). Sau khi đã bật, bước này
          # chỉ tìm thấy site có sẵn và đi tiếp bình thường.
          enablement: true
      # App là web tĩnh — không cần build, upload thẳng thư mục gốc.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
